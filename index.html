<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하루 — 루틴 · 일정 · 목표 · 가계부</title>
<meta name="theme-color" content="#0F1116">
<meta name="description" content="루틴·할 일·일정·목표·가계부를 한 화면에서 관리하는 개인 기록 앱">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon-v24.png">
<link rel="icon" href="icon-192-v24.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="하루">
<style>
:root{
  --paper:#0F1116; --card:#181B22; --card2:#1F232C;
  --ink:#E9EBF2; --muted:#8A90A0; --line:#272B35;
  --cell:#1C2028; --cell2:#282D38; --onAccent:#0A1017;
  --plan:#8AA9FF; --plan-soft:#1A2340;
  --task:#F2789A; --task-soft:#33202A;
  --habit:#56B7F2; --habit-soft:#152C3D;
  --goal:#E5B15E; --goal-soft:#332816;
  --h0:#1C2028; --h1:#173A4E; --h2:#1E5B7C; --h3:#2E8CB8; --h4:#56B7F2;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 26px rgba(0,0,0,.30);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-size:15px;line-height:1.5;
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;text-align:left}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--plan);outline-offset:2px;border-radius:8px}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 104px}

.top{padding:22px 0 6px}
.datenav{display:flex;align-items:center;gap:10px}
.datenav h1{margin:0;font-size:26px;font-weight:750;letter-spacing:-.02em}
.datenav .date{margin:3px 0 0;font-size:13.5px;font-weight:650;letter-spacing:-.01em}
.datenav .sub{display:block;margin:2px 0 0;padding:0;font-size:12.5px;color:var(--muted);
  line-height:1.45;text-align:left}
.arrow{width:34px;height:34px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);
  display:grid;place-items:center;font-size:15px;color:var(--muted);flex:none}
.pill{margin-left:auto;font-size:12px;font-weight:650;color:var(--plan);
  background:var(--plan-soft);padding:7px 11px;border-radius:999px;flex:none}
.pill.g{color:var(--goal);background:var(--goal-soft)}
.moderow{display:flex;align-items:center;gap:9px;padding:12px 16px;border-top:1px solid var(--line)}
.moderow.on{background:var(--goal-soft)}
.moderow .mi{flex:1;min-width:0}
.moderow .mi b{display:block;font-size:14.5px;font-weight:700}
.moderow .mi b u{text-decoration:none;font-size:10px;font-weight:750;padding:2px 6px;border-radius:5px;
  background:var(--cell2);color:var(--muted);vertical-align:2px}
.moderow .mi b s{text-decoration:none;font-size:10px;font-weight:750;padding:2px 6px;border-radius:5px;
  background:var(--goal);color:var(--onAccent);vertical-align:2px}
.moderow .mi small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.moderow .mact{flex:none;font-size:12px;font-weight:700;color:var(--onAccent);background:var(--habit);
  padding:8px 12px;border-radius:999px}
.moderow .medit{flex:none;font-size:12px;font-weight:650;color:var(--muted);background:var(--card2);
  padding:8px 11px;border-radius:999px}
.modebar{display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;padding:12px 14px;
  border-radius:16px;background:var(--goal-soft);box-shadow:var(--shadow)}
.modebar .mb{flex:1;font-size:13px;color:var(--goal)}
.modebar .mb b{font-size:14.5px;font-weight:750}
.modebar .ms{flex:none;font-size:11px;color:var(--goal);opacity:.8}
.yearbar{display:block;width:100%;background:var(--card);border-radius:16px;padding:12px 14px 13px;
  box-shadow:var(--shadow);margin-top:14px}
.yearbar .yl{display:block;font-size:13.5px;color:var(--muted)}
.yearbar .yl b{font-size:14.5px;font-weight:750;color:var(--ink);letter-spacing:-.01em}
.yearbar .bar{margin-top:9px}
.yearbar .bar i{background:linear-gradient(90deg,var(--plan),var(--habit))}
.yearbar .ys{display:block;margin-top:6px;font-size:11.5px;color:var(--muted);text-align:right}
.gauges{display:flex;gap:8px;margin-top:14px}
.gauge{flex:1;background:var(--card);border-radius:16px;padding:11px 12px 12px;box-shadow:var(--shadow);min-width:0}
.gauge .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted);gap:4px}
.gauge .lab b{font-size:15px;font-weight:750;color:var(--ink);white-space:nowrap}
.gauge .lab b s{text-decoration:none;font-weight:500;color:var(--muted);font-size:13px}
.bar{height:5px;border-radius:99px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .35s ease}
.g-habit .bar i{background:var(--habit)}
.g-task .bar i{background:var(--task)}
.g-money .bar i{background:var(--goal)}

.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);margin-top:14px;overflow:hidden}
.card > header{display:flex;align-items:center;gap:9px;padding:15px 16px 0}
.card > header h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
.card > header .count{font-size:12.5px;color:var(--muted)}
.card > header .add{margin-left:auto;font-size:13px;font-weight:650;color:var(--plan);flex:none}
.empty{padding:14px 16px 16px;font-size:13.5px;color:var(--muted);line-height:1.6}
.sechead{display:flex;align-items:center;gap:8px;margin:22px 2px 0}
.sechead h2{margin:0;font-size:14px;font-weight:700}
.sechead span{font-size:12.5px;color:var(--muted)}
.sechead button{margin-left:auto;font-size:13px;font-weight:650;color:var(--plan)}
.addbtn{padding:12px 16px 13px;border-top:1px solid var(--line);font-size:13px;
  font-weight:650;color:var(--plan);display:block;width:100%}
.subhead{padding:12px 16px 0;font-size:12px;font-weight:650;color:var(--muted)}

.ddays{display:flex;gap:10px;overflow-x:auto;padding:14px 16px 2px;margin:0 -16px;scrollbar-width:none}
.ddays::-webkit-scrollbar{display:none}
.dday{flex:none;width:150px;background:var(--card);border-radius:18px;padding:13px 14px;
  box-shadow:var(--shadow);border-top:3px solid var(--goal)}
.dday .n{font-size:23px;font-weight:780;letter-spacing:-.03em;line-height:1.1}
.dday .n.past{color:var(--muted)}
.dday b{display:block;font-size:13px;font-weight:650;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dday small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.dday .bar{margin-top:9px}
.dday .bar i{background:var(--goal)}

.grp{margin-top:14px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.grp.full{background:linear-gradient(180deg,var(--habit-soft),var(--card) 62%)}
.gh{display:flex;align-items:center;gap:11px;padding:15px 16px 12px}
.gh .ring{flex:none;position:relative;width:38px;height:38px}
.gh .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:750}
.gh .t{flex:1;min-width:0;text-align:left}
.gh .t .fx{font-style:normal;font-size:10px;color:var(--muted);vertical-align:1px}
.seg4 button{font-size:12px;padding:9px 1px;display:flex;align-items:center;justify-content:center;gap:4px}
.seg4 button u{text-decoration:none;font-size:10.5px;font-weight:700;opacity:.65}
.lst{padding:6px 0}
.lrow{display:grid;grid-template-columns:62px 1fr 34px;gap:8px;align-items:center;
  padding:5px 14px 5px 10px}
.lrow .lw{font-size:11px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden}
.lrow .lw b{font-size:12px;font-weight:750;color:var(--ink)}
.lband{padding:12px 14px 4px 10px;font-size:11.5px;font-weight:700;color:var(--habit);
  letter-spacing:.02em}
.lband:first-child{padding-top:6px}
.lrow .ln{border-left:3px solid transparent;padding:9px 0 9px 10px;font-size:14px;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .ln .mn{font-style:normal;font-size:11px;color:var(--muted);margin-left:6px}
.lrow .lc{width:26px;height:26px;border-radius:50%;border:1.7px solid #3A4C5F;
  display:grid;place-items:center;font-size:13px;color:var(--onAccent);justify-self:end}
.lrow.done .nmx{color:var(--muted);text-decoration:line-through}
.lrow .nmx{display:inline}
.lband{display:flex;align-items:baseline;gap:7px}
.lband u{text-decoration:none;font-size:11px;font-weight:700;color:var(--muted)}
.gh .t b{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.gh .t small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.gh .allbtn{flex:none;font-size:12px;font-weight:650;color:var(--habit);
  background:var(--habit-soft);padding:8px 11px;border-radius:999px}
.grp.full .gh .allbtn{background:var(--card2);color:var(--muted)}
.hb{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);
  border-left:3px solid transparent;padding-right:12px}
.hb .main{flex:1;min-width:0;display:flex;align-items:center;gap:11px;padding:11px 0 11px 13px}
.hb .tick{width:22px;height:22px;flex:none;border-radius:50%;border:1.7px solid #3A4C5F;
  display:grid;place-items:center;font-size:12px;color:transparent;transition:all .18s}
.hb .nm{flex:1;font-size:14.5px;min-width:0}
.hb .at{flex:none;font-size:12px;font-weight:700;color:var(--habit);background:var(--habit-soft);
  padding:5px 9px;border-radius:999px}
.hb .vv{flex:none;font-size:11.5px;font-weight:700;color:var(--habit);background:var(--habit-soft);
  padding:5px 8px;border-radius:999px;min-width:30px;text-align:center}
.hb .at{font-size:11.5px !important;padding:5px 8px !important}
.hb .st{font-size:11.5px !important}
.hb .cnt{flex:none;font-size:11.5px;font-weight:750;color:var(--habit);background:var(--habit-soft);
  padding:5px 9px;border-radius:999px}
.hb .cnt.full{background:var(--habit);color:var(--onAccent)}
.hb .rest{flex:none;font-size:11px;font-weight:700;color:var(--muted);background:var(--cell2);
  padding:5px 8px;border-radius:999px}
.hb .rest.on{color:var(--goal);background:var(--goal-soft)}
.hb.skip .nm{opacity:.45}
.hb.skip .tick{opacity:.3}
.hcal i.sk{background:var(--goal-soft);color:var(--goal)}
.wkr i.sk{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.lrow.skip .nmx{opacity:.45}
.lrow .lrest{font-size:10.5px;font-weight:700;color:var(--muted)}
.hb .tm2{font-style:normal;font-size:11.5px;font-weight:700;color:var(--muted);margin-right:6px}
.hb .mn{font-style:normal;font-size:11px;color:var(--muted);margin-left:6px}
.lvb{display:inline-block;font-size:9.5px;font-weight:800;padding:2px 5px;border-radius:5px;
  vertical-align:2px;background:var(--cell2);color:var(--muted)}
.lvb.mini{background:var(--habit-soft);color:var(--habit)}
.lvb.plus{background:var(--plan-soft);color:var(--plan)}
.lvb.max{background:var(--task-soft);color:var(--task)}
.lvrow{display:flex;align-items:center;gap:11px;width:100%;padding:13px 14px;border-radius:14px;
  background:var(--card2);margin-bottom:8px}
.lvrow b{flex:none;font-size:10px;font-weight:800;padding:3px 7px;border-radius:6px}
.lvrow span{flex:1;font-size:14.5px}
.wk{padding:6px 16px 10px}
.wkh,.wkr{display:grid;grid-template-columns:1fr repeat(7,22px);gap:5px;align-items:center}
.wkh{padding-bottom:6px}
.wkh i{font-style:normal;font-size:10.5px;color:var(--muted);text-align:center}
.wkh i.td{color:var(--ink);font-weight:750}
.wkr{padding:4px 0}
.wkr span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px}
.wkr i{height:22px;border-radius:6px;background:var(--cell);display:block}
.wkr i.on{background:var(--habit)}
.wkr i.miss{background:var(--task-soft);box-shadow:inset 0 0 0 1.5px var(--task)}
.wkr i.off{background:var(--cell);opacity:.55}
.wkr i.fu,.wkr i.sch{background:var(--cell);box-shadow:inset 0 0 0 1.5px var(--habit)}
.wkr i.sk{background:var(--goal-soft);box-shadow:inset 0 0 0 1.5px var(--goal)}
.wkl{display:flex;align-items:center;gap:5px;padding:2px 16px 14px;font-size:11px;color:var(--muted)}
.wkl i{width:12px;height:12px;border-radius:4px;display:inline-block;background:var(--cell)}
.wkl i.on{background:var(--habit)}
.wkl i.miss{background:var(--task-soft);box-shadow:inset 0 0 0 1.5px var(--task)}
.wkl i.off{background:var(--cell);opacity:.55}
.wkl i.sk{background:var(--goal-soft);box-shadow:inset 0 0 0 1.5px var(--goal)}
.gcal{padding:6px 14px 10px}
.gch{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.gch span{text-align:center;font-size:10.5px;color:var(--muted)}
.gcg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.gd{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:12px;
  background:var(--h0);color:var(--muted)}
.gd.e{background:transparent}
.gd.lf{background:var(--cell);color:#4A5160}
.gd.l1{background:var(--h1)} .gd.l2{background:var(--h2);color:#D8ECF7}
.gd.l3{background:var(--h3);color:#fff} .gd.l4{background:var(--h4);color:var(--onAccent)}
.gd.td{box-shadow:0 0 0 2px var(--habit)}
.hb .st{flex:none;font-size:11.5px;font-weight:700;color:var(--habit);opacity:.7}
.hb.done .tick{background:var(--habit);border-color:var(--habit);color:var(--onAccent)}
.hb.done .nm .nmx{color:var(--muted);text-decoration:line-through}

.ev{display:flex;gap:11px;width:100%;padding:11px 13px 11px 16px;border-top:1px solid var(--line);
  align-items:flex-start;border-left:3px solid transparent}
.ev .tm{flex:none;width:46px;font-size:12.5px;font-weight:700;padding-top:1px}
.ev .bd{flex:1;min-width:0}
.ev .bd b{display:block;font-size:14.5px;font-weight:600}
.ev .bd small{display:block;font-size:12px;color:var(--muted)}
.ev .bd .loc{font-size:12px;color:var(--muted)}
.ev.now{background:var(--plan-soft)}
.ev.now .bd b::after{content:'진행 중';margin-left:7px;font-size:11px;font-weight:700;color:var(--plan)}
.ev.gl{background:var(--goal-soft);border-left-color:var(--goal)}
.ev.gl .tm{color:var(--goal)}
.ev .bell{flex:none;font-size:11px;color:var(--muted)}
.ev .ctag{flex:none;font-size:11px;font-weight:650;padding:3px 7px;border-radius:99px}

.todo{display:flex;align-items:center;gap:11px;width:100%;padding:10px 16px;border-top:1px solid var(--line)}
.todo .box{width:21px;height:21px;flex:none;border-radius:7px;border:1.7px solid #4E3A44;
  display:grid;place-items:center;font-size:12px;color:transparent}
.todo span{flex:1;font-size:14.5px}
.todo .tag{font-size:11px;font-weight:650;color:var(--goal);background:var(--goal-soft);
  padding:3px 7px;border-radius:99px;flex:none}
.todo .x{color:var(--muted);font-size:16px;opacity:.55;flex:none;padding:0 2px}
.todo.done .box{background:var(--task);border-color:var(--task);color:var(--onAccent)}
.todo.done span{color:var(--muted);text-decoration:line-through}
.todo.gl .box{border-color:#574828}
.todo.gl.done .box{background:var(--goal);border-color:var(--goal)}
.addtodo{display:flex;gap:8px;padding:11px 12px 12px;border-top:1px solid var(--line)}
.addtodo input{flex:1;border:none;background:var(--card2);border-radius:12px;padding:11px 13px;font-size:14.5px}
.addtodo button{background:var(--task);color:#fff;font-size:13px;font-weight:700;padding:11px 15px;border-radius:12px}
.overdue{margin:12px 16px 0;padding:11px 13px;border-radius:14px;background:var(--task-soft)}
.overdue p{margin:0;font-size:12.5px;font-weight:650;color:var(--task);display:flex;gap:8px;align-items:center}
.overdue p button{margin-left:auto;font-size:12px;font-weight:700;color:var(--task);text-decoration:underline}

.goal{margin-top:14px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.gth{display:flex;gap:12px;padding:16px 16px 13px;align-items:flex-start}
.gth .big{flex:none;text-align:center;min-width:66px;background:var(--goal-soft);border-radius:14px;padding:8px 6px}
.gth .big i{display:block;font-style:normal;font-size:20px;font-weight:780;letter-spacing:-.03em;color:var(--goal)}
.gth .big s{display:block;text-decoration:none;font-size:10.5px;color:var(--goal);opacity:.8}
.gth .gt{flex:1;min-width:0}
.gth .gt b{font-size:16px;font-weight:720}
.gth .gt small{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.gth .pbar{display:block;position:relative;height:9px;border-radius:99px;background:var(--cell2);
  margin-top:10px;overflow:visible}
.gth .pbar i{display:block;height:100%;border-radius:99px;background:var(--goal);transition:width .35s}
.gth .pbar s{position:absolute;top:-3px;width:2px;height:15px;background:var(--ink);opacity:.55;
  text-decoration:none;border-radius:2px}
.gth .pl{display:flex;align-items:center;gap:9px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.gth .pl .tg{margin-left:auto;font-size:11px;font-weight:750;padding:3px 8px;border-radius:999px}
.gth .pl .tg.ok{background:var(--habit-soft);color:var(--habit)}
.gth .pl .tg.mid{background:var(--cell2);color:var(--muted)}
.gth .pl .tg.late{background:var(--task-soft);color:var(--task)}
.step{display:flex;align-items:center;gap:11px;width:100%;padding:10px 16px;border-top:1px solid var(--line)}
.step .box{width:20px;height:20px;flex:none;border-radius:6px;border:1.7px solid #574828;
  display:grid;place-items:center;font-size:11px;color:transparent}
.step span{flex:1;font-size:14px}
.step small{font-size:11.5px;color:var(--muted);flex:none}
.step.done .box{background:var(--goal);border-color:var(--goal);color:var(--onAccent)}
.step.done span{color:var(--muted);text-decoration:line-through}
.step.late small{color:var(--task);font-weight:650}

.mrow{display:flex;align-items:center;gap:11px;width:100%;padding:12px 16px;
  border-top:1px solid var(--line);border-left:3px solid transparent}
.mrow .info{flex:1;min-width:0}
.mrow b{display:block;font-size:14.5px;font-weight:650}
.mrow small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.mrow .chev{color:var(--muted);font-size:15px;flex:none}
.mrow .minfo{flex:1;display:flex;align-items:center;gap:11px;min-width:0}
.mvs{display:flex;flex-direction:column;gap:3px;flex:none}
.mvs button{width:28px;height:19px;border-radius:6px;background:var(--card2);color:var(--muted);
  font-size:9px;display:grid;place-items:center}
.mvs button:disabled{opacity:.28}
.week{display:flex;gap:3px;flex:none}
.week i{width:15px;height:21px;border-radius:5px;background:var(--cell);display:grid;
  place-items:center;font-size:9px;color:#5B6273;font-style:normal;font-weight:650}
.week i.on{background:var(--habit);color:var(--onAccent)}
.week i.no{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:#4A5160}

.seg{display:flex;gap:6px;background:var(--card);border-radius:14px;padding:4px;
  box-shadow:var(--shadow);margin-top:14px}
.seg button{flex:1;text-align:center;padding:9px 0;border-radius:11px;font-size:13.5px;
  font-weight:650;color:var(--muted)}
.seg button.on{background:var(--habit);color:var(--onAccent)}
.catbar{display:flex;gap:7px;overflow-x:auto;padding:12px 16px 2px;margin:0 -16px;scrollbar-width:none}

let lineBump=0;
function linePool(){
  const mine=(S&&S.lines)?S.lines.filter(x=>x&&x.trim()):[];
  const mode=(S&&S.lineMode)||'both';
  if(mode==='mine'&&mine.length) return mine;
  if(mode==='basic') return LINES;
  return mine.length?mine.concat(LINES):LINES;
}
function lineFor(dateStr){
  const pool=linePool();
  if(!pool.length) return '';
  let h=0;
  for(let i=0;i<dateStr.length;i++) h=(h*31+dateStr.charCodeAt(i))%99991;
  return pool[(h+lineBump)%pool.length];
}
function yearLeft(){
  const t=today(), y=+t.slice(0,4);
  const end=`${y}-12-31`;
  const left=diffDays(t,end);
  const total=diffDays(`${y}-01-01`,end)+1;
  const passed=total-left;
  return {y,left,total,passed,pct:passed/total};
}

function migrate(d){
  if(!d.version){
    d.cats=DEF_CATS.map(([id,name,color])=>({id,name,color}));
    (d.habits||[]).forEach(h=>{h.catId=h.catId||'lf'});
    Object.values(d.logs||{}).forEach(l=>Object.keys(l.habits||{}).forEach(k=>{
      if(l.habits[k]===true) l.habits[k]={at:''}; }));
    d.money=d.money||[]; d.budget=d.budget||0; d.version=2;
  }
  if(d.version<3){
    d.mcats=DEF_MCATS.map(([id,name,color,type])=>({id,name,color,type}));
    (d.groups||[]).forEach(g=>{g.notify=g.notify||''});
    (d.events||[]).forEach(e=>{e.notify=e.notify||''});
    d.notify={on:false,fired:{}}; d.version=3;
  }
  if(d.version<4){
    d.ecats=DEF_ECATS.map(([id,name,color])=>({id,name,color}));
    (d.events||[]).forEach(e=>{
      e.catId=e.catId||'eetc';
      e.endDate=e.endDate||e.date||null;
      e.allDay=!!e.allDay; e.location=e.location||'';
    });
    d.version=4;
  }
  if(d.version<5){ d.push={url:'',id:'',on:false,at:'',err:''}; d.version=5; }
  if(d.version<6){ d.sync={room:'',on:false,rev:0,at:''}; d.version=6; }
  if(d.version<7){ d.lines=[]; d.lineMode='both'; d.version=7; }
  if(d.version<8){
    (d.habits||[]).forEach(h=>{ h.track=h.track||''; h.unit=h.unit||''; h.streakOn=h.streakOn!==false; });
    d.version=8;
  }
  if(d.version<9){
    (d.habits||[]).forEach(h=>{ h.lv=h.lv||{mini:'',plus:'',max:''}; });
    d.version=9;
  }
  if(d.version<11){ d.collapsed={}; d.homeView='card'; d.version=11; }
  if(d.version<19){ (d.habits||[]).forEach(h=>{h.byDay=h.byDay||{}}); d.version=19; }
  if(d.version<18){ (d.habits||[]).forEach(h=>{h.from=h.from||''; h.to=h.to||''}); d.version=18; }
  if(d.version<17){ (d.habits||[]).forEach(h=>{h.times=h.times||1}); d.version=17; }
  if(d.version<16){ (d.groups||[]).forEach((g,i)=>{g.gord=i}); d.version=16; }
  if(d.version<15){ d.modeOverride=null; d.version=15; }
  if(d.version<14){ d.activeModeId=''; d.version=14; }
  if(d.version<13){
    d.modes=[];
    (d.groups||[]).forEach(g=>{g.mode=g.mode||''});
    (d.habits||[]).forEach(h=>{h.mode=h.mode||''});
    d.version=13;
  }
  if(d.version<12){
    const by={};
    (d.habits||[]).forEach(h=>{ const k=h.groupId||'__solo';
      by[k]=(by[k]||0); h.ord=by[k]++; });
    d.version=12;
  }
  if(d.version<10){
    (d.habits||[]).forEach(h=>{ h.icon=h.icon||''; h.time=h.time||''; h.notify=h.notify||''; h.min=h.min||0; });
    (d.groups||[]).forEach(g=>{ g.min=g.min||0; });
    d.version=10;
  }
  ['cats','ecats','mcats','groups','habits','events','todos','goals','money'].forEach(k=>d[k]||=[]);
  d.logs||={}; d.notify||={on:false,fired:{}}; d.notify.fired||={};
  d.push||={url:'',id:'',on:false,at:'',err:''};
  d.sync||={room:'',on:false,rev:0,at:''};
  d.lines||=[]; d.lineMode||='both'; d.modes||=[];
  if(typeof d.activeModeId!=='string') d.activeModeId='';
  if(d.modeOverride===undefined) d.modeOverride=null; d.collapsed||={}; d.homeView||='card';
  return d;
}
/* 저장소: 클로드 저장소 → 브라우저 저장소 → 메모리 순으로 자동 선택 */
const STORE=(()=>{
  let mode='memory', mem={};
  const LABEL={claude:'클로드 계정 저장소 (폰·웹 같이 보임)',
    local:'이 브라우저 저장소',memory:'임시 (닫으면 사라짐)'};
  return {
    async init(){
      try{
        if(window.storage&&typeof window.storage.set==='function'){
          await window.storage.set('haru:ping','1');
          mode='claude'; return mode;
        }
      }catch(e){}
      try{
        localStorage.setItem('haru:ping','1'); localStorage.removeItem('haru:ping');
        mode='local'; return mode;
      }catch(e){}
      mode='memory'; return mode;
    },
    async get(k){
      if(mode==='claude'){ const r=await window.storage.get(k); return r&&r.value; }
      if(mode==='local') return localStorage.getItem(k);
      return mem[k];
    },
    async set(k,v){
      if(mode==='claude') return window.storage.set(k,v);
      if(mode==='local') return localStorage.setItem(k,v);
      mem[k]=v;
    },
    mode:()=>mode,
    label:()=>LABEL[mode]
  };
})();

/* 파일 전달: 공유 시트를 쓸 수 있으면 그쪽으로, 아니면 내려받기 */
async function sendFile(name,text,type,okMsg){
  try{
    if(navigator.canShare&&window.File){
      const f=new File([text],name,{type});
      if(navigator.canShare({files:[f]})){
        await navigator.share({files:[f],title:name});
        return;
      }
    }
  }catch(e){
    if(e&&e.name==='AbortError') return;
  }
  try{
    const url=URL.createObjectURL(new Blob([text],{type}));
    const a=document.createElement('a');
    a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast(okMsg);
  }catch(e){ toast('파일을 만들지 못했어요. 사파리에서 열어 주세요.'); }
}

/* 최신 버전 강제로 받아오기 */
async function hardRefresh(){
  toast('최신 버전을 받아오는 중…');
  try{
    if(navigator.serviceWorker){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const r of regs) await r.unregister();
    }
  }catch(e){}
  try{
    if(window.caches){
      const ks=await caches.keys();
      await Promise.all(ks.map(k=>caches.delete(k)));
    }
  }catch(e){}
  setTimeout(()=>{
    location.replace(location.pathname.replace(/index\.html$/,'')+'index.html?v='+Date.now());
  },400);
}

}

const log=d=>(S.logs[d]||={habits:{},note:''});
const rec=(d,id)=>log(d).habits[id];
const habById=id=>S.habits.find(x=>x.id===id);
const habTimes=id=>{const h=habById(id);return (h&&h.times>1)?h.times:1};
const doneN=(d,id)=>{const r=rec(d,id);return r?(r.n||1):0};
const skipsOf=d=>{const l=log(d); if(!l.skips) l.skips={}; return l.skips};
const isSkip=(d,id)=>!!skipsOf(d)[id];
const isDone=(d,id)=>doneN(d,id)>=habTimes(id);
const doneAt=(d,id)=>{const r=rec(d,id);return r&&r.at?r.at:''};
const doneVal=(d,id)=>{const r=rec(d,id);return r&&r.v?r.v:''};
const NOCAT={id:'',name:'분류 없음',color:'#8A87A0'};
const catOf=id=>S.cats.find(c=>c.id===id)||NOCAT;
const ecatOf=id=>S.ecats.find(c=>c.id===id)||NOCAT;
const mcatOf=id=>S.mcats.find(c=>c.id===id)||{...NOCAT,type:'out'};
const grpOf=id=>S.groups.find(g=>g.id===id);
const habDays=h=>h.days||((grpOf(h.groupId)||{days:[0,1,2,3,4,5,6]}).days);
const alive=h=>!h.groupId||!!grpOf(h.groupId);
const inRange=(h,d)=>(!h.from||d>=h.from)&&(!h.to||d<=h.to);
const bd=(h,dw)=>(h.byDay&&h.byDay[dw])||null;
const effGroupDow=(h,dw)=>{const b=bd(h,dw);return (b&&typeof b.g==='string')?b.g:(h.groupId||'')};
const effTimeDow=(h,dw)=>{const b=bd(h,dw);return (b&&b.t)?b.t:(h.time||'')};
const effMinDow=(h,dw)=>{const b=bd(h,dw);return (b&&b.m)?b.m:(h.min||0)};
const effMin=(h,d)=>effMinDow(h,dow(d));
const effGroup=(h,d)=>effGroupDow(h,dow(d));
const effTime=(h,d)=>effTimeDow(h,dow(d));
const hasByDay=h=>!!(h.byDay&&Object.keys(h.byDay).length);
const onDay=(h,d)=>habDays(h).includes(dow(d))&&inRange(h,d);
const habitsOn=d=>S.habits.filter(h=>alive(h)&&onDay(h,d)&&inMode(modeOf(h),d));
const soloOn=d=>S.habits.filter(h=>alive(h)&&effGroup(h,d)===''&&onDay(h,d)&&inMode(h.mode||'',d))
  .sort((a,b)=>{
    const ta=effTime(a,d)||'99:99', tb=effTime(b,d)||'99:99';
    return (ta<tb?-1:ta>tb?1:0)||byOrd(a,b);
  });
const byOrd=(a,b)=>(a.ord||0)-(b.ord||0);
function activeMode(d){
  const ov=S.modeOverride;
  if(ov&&ov.date===d)
    return ov.id?((S.modes||[]).find(m=>m.id===ov.id)||null):null;
  const ms=(S.modes||[]).filter(m=>m.from&&m.to&&d>=m.from&&d<=m.to)
    .sort((a,b)=>a.from<b.from?-1:1);
  if(ms.length) return ms[ms.length-1];
  const id=S.activeModeId||'';
  return id?((S.modes||[]).find(m=>m.id===id)||null):null;
}
const modeReserved=d=>(S.modes||[]).some(m=>m.from&&m.to&&d>=m.from&&d<=m.to);
function inMode(mv,d){
  const am=activeMode(d);
  mv=mv||'';
  if(!am) return mv==='';
  if(mv===am.id) return true;
  return !!am.base&&mv==='';
}
const modeOf=h=>h.mode||((grpOf(h.groupId)||{}).mode||'');
const habitsOfGroup=gid=>S.habits.filter(h=>h.groupId===gid).sort(byOrd);
const inGroupAny=(h,gid)=>h.groupId===gid||
  (h.byDay&&Object.keys(h.byDay).some(k=>h.byDay[k].g===gid));
const habitsOfGroupAny=gid=>S.habits.filter(h=>inGroupAny(h,gid)).sort(byOrd);
const noGroupAny=h=>!h.groupId&&!(h.byDay&&Object.keys(h.byDay).some(k=>typeof h.byDay[k].g==='string'&&h.byDay[k].g));
const habitsOfGroupOn=(gid,d)=>S.habits
  .filter(h=>alive(h)&&effGroup(h,d)===gid&&onDay(h,d)&&inMode(modeOf(h),d))
  .sort(byOrd);
const byGord=(a,b)=>(a.gord||0)-(b.gord||0);
const groupsOn=d=>S.groups.filter(g=>inMode(g.mode,d)&&habitsOfGroupOn(g.id,d).length)
  .sort((a,b)=>{
    const t=((a.time||'99:99')<(b.time||'99:99'))?-1:((a.time||'99:99')>(b.time||'99:99')?1:0);
    return t||byGord(a,b);
  });
const isRepeat=e=>!!(e.repeatDays&&e.repeatDays.length);
const evSpan=e=>(!isRepeat(e)&&e.date&&e.endDate)?diffDays(e.date,e.endDate)+1:1;
function eventsOn(d){
  return S.events.filter(e=>isRepeat(e)?e.repeatDays.includes(dow(d))
    :(e.date&&d>=e.date&&d<=(e.endDate||e.date)))
    .sort((a,b)=>{
      const A=a.allDay?1:0, B=b.allDay?1:0;
      if(A!==B) return B-A;
      return toMin(a.start)-toMin(b.start);
    });
}
const todosOn=d=>S.todos.filter(t=>t.date===d);
const moneyOn=d=>S.money.filter(m=>m.date===d);
const moneyIn=ym=>S.money.filter(m=>monthOf(m.date)===ym);
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const rate=d=>{
  const hs=habitsOn(d).filter(h=>!isSkip(d,h.id));
  return hs.length?hs.filter(h=>isDone(d,h.id)).length/hs.length:null;
};
function streak(h){
  let n=0,d=today(),days=habDays(h);
  for(let i=0;i<400;i++){
    if(h.from&&d<h.from) break;
    if(days.includes(dow(d))&&inRange(h,d)&&!isSkip(d,h.id)){
      if(isDone(d,h.id)) n++;
      else if(d!==today()) break;
    }
    d=addDays(d,-1);
  }
  return n;
}
const avgRate=l=>{const v=l.map(rate).filter(r=>r!==null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
const monStart=d=>addDays(d,-((dow(d)+6)%7));
const goalProg=g=>{const s=g.steps||[];return s.length?s.filter(x=>x.done).length/s.length:0};
function avgTime(h,range){
  const ts=range.map(d=>doneAt(d,h.id)).filter(Boolean).map(toMin);
  return ts.length?toTime(Math.round(ts.reduce((a,b)=>a+b,0)/ts.length)):'';
}

/* ══════════ 알림 ══════════ */
function alarmsFor(d){
  const out=[];
  S.groups.forEach(g=>{
    if(!g.notify||!g.time||!g.days.includes(dow(d))) return;
    if(!inMode(g.mode,d)) return;
    const hs=habitsOfGroupOn(g.id,d); if(!hs.length) return;
    out.push({key:'g'+g.id,at:toMin(g.time)-+g.notify,title:g.name+' 시간이에요',
      body:hs.map(h=>h.name).join(', '),label:g.name,kind:'루틴'});
  });
  S.habits.forEach(h=>{
    if(!h.notify||!alive(h)) return;
    const ht=effTime(h,d);
    if(!ht) return;
    if(!onDay(h,d)) return;
    if(!inMode(modeOf(h),d)) return;
    out.push({key:'h'+h.id,at:toMin(ht)-+h.notify,title:h.name+' 시간이에요',
      body:h.min?h.min+'분 예정':'',label:h.name,kind:'습관'});
  });
  eventsOn(d).forEach(e=>{
    if(!e.notify) return;
    const first=isRepeat(e)||e.date===d;
    const base=e.allDay?9*60:toMin(e.start);
    let at=base-+e.notify;
    if(+e.notify>=1440){ if(!first||addDays(d,0)!==d) return; at=base; }
    if(!first&&!e.allDay) return;
    out.push({key:'e'+e.id,at,title:e.title,
      body:(e.allDay?'하루 종일':e.start+' 시작')+(e.location?' · '+e.location:''),
      label:e.title,kind:'일정'});
  });
  S.events.forEach(e=>{
    if(!e.notify||+e.notify<1440||isRepeat(e)||!e.date) return;
    const warn=addDays(e.date,-1);
    if(warn!==d) return;
    out.push({key:'w'+e.id,at:20*60,title:'내일 '+e.title,
      body:(e.allDay?'하루 종일':e.start+' 시작')+(e.location?' · '+e.location:''),
      label:e.title+' (하루 전)',kind:'일정'});
  });
  S.goals.forEach(g=>{
    if(g.due===d) out.push({key:'d'+g.id,at:9*60,title:`오늘이 ${g.title} 날이에요`,body:'D-DAY',label:g.title,kind:'목표'});
    (g.steps||[]).forEach(s=>{ if(s.due===d&&!s.done)
      out.push({key:'s'+s.id,at:9*60,title:s.title,body:`${g.title} 단계 마감일`,label:s.title,kind:'단계'}); });
  });

}
const notifState=()=>typeof Notification==='undefined'?'unsupported':Notification.permission;
async function askNotify(){
  if(typeof Notification==='undefined'){
    S.notify.on=true; save(); render(); toast('이 환경에서는 앱 안 배너로만 알려드려요'); return;
  }

  }catch(e){ S.notify.on=true; save(); render(); }
}
function beep(){
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    const ctx=new C(), o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination); o.frequency.value=880; o.type='sine';
    g.gain.setValueAtTime(.0001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.25,ctx.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.5);
    o.start(); o.stop(ctx.currentTime+.55);
  }catch(e){}
}
function banner(title,body){
  const b=$('#banner');
  b.innerHTML=`<b>${esc(title)}</b><p>${esc(body||'')}</p><s data-closebanner="1">×</s>`;
  b.classList.add('on');
  clearTimeout(b._t); b._t=setTimeout(()=>b.classList.remove('on'),12000);
}
function tickNotify(){
  if(!S||!S.notify.on) return;
  const t=today(), now=nowMin();
  S.notify.fired=Object.fromEntries(Object.entries(S.notify.fired||{}).filter(([k])=>k.startsWith(t)));
  let changed=false;
  alarmsFor(t).forEach(a=>{
    const k=t+':'+a.key;
    if(S.notify.fired[k]) return;
    if(now>=a.at&&now<=a.at+2){
      S.notify.fired[k]=true; changed=true;
      if(notifState()==='granted'){ try{ new Notification(a.title,{body:a.body,tag:k}); }catch(e){} }
      banner(a.title,a.body); beep();
    }
  });
  if(changed) save();
}

/* ══════════ 내보내기(.ics) ══════════ */
const icsEsc=s=>String(s).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
const icsDT=(d,hm)=>{const[h,mi]=(hm||'09:00').split(':');
  return d.replace(/-/g,'')+'T'+pad(+h)+pad(+mi)+'00'};
const icsD=d=>d.replace(/-/g,'');
function nextDateFor(days){
  for(let i=0;i<7;i++){const d=addDays(today(),i);if(days.includes(dow(d)))return d}
  return today();
}
function buildICS(){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//haru//KO','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  const stamp=icsDT(today(),nowHM());
  const add=o=>{
    L.push('BEGIN:VEVENT','UID:'+uid()+'@haru','DTSTAMP:'+stamp,o.dtstart,o.dtend,
      'SUMMARY:'+icsEsc(o.title));
    if(o.loc) L.push('LOCATION:'+icsEsc(o.loc));
    if(o.cat) L.push('CATEGORIES:'+icsEsc(o.cat));
    if(o.desc) L.push('DESCRIPTION:'+icsEsc(o.desc));
    if(o.rrule) L.push('RRULE:'+o.rrule);
    if(o.alarm!==undefined&&o.alarm!==null)
      L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(o.title),
        'TRIGGER:-PT'+o.alarm+'M','END:VALARM');
    L.push('END:VEVENT');
  };
  S.events.forEach(e=>{
    const cat=ecatOf(e.catId).name, al=e.notify!==''?+e.notify:undefined;
    if(isRepeat(e)){
      const d=nextDateFor(e.repeatDays);
      add({dtstart:'DTSTART:'+icsDT(d,e.allDay?'09:00':e.start),
        dtend:'DTEND:'+icsDT(d,e.allDay?'09:30':e.end),title:e.title,loc:e.location,cat,alarm:al,
        rrule:'FREQ=WEEKLY;BYDAY='+e.repeatDays.map(x=>BYDAY[x]).join(',')});
    } else if(e.allDay){
      add({dtstart:'DTSTART;VALUE=DATE:'+icsD(e.date),
        dtend:'DTEND;VALUE=DATE:'+icsD(addDays(e.endDate||e.date,1)),
        title:e.title,loc:e.location,cat,alarm:al});
    } else {
      add({dtstart:'DTSTART:'+icsDT(e.date,e.start),
        dtend:'DTEND:'+icsDT(e.endDate||e.date,e.end),title:e.title,loc:e.location,cat,alarm:al});
    }
  });
  S.groups.forEach(g=>{
    if(!g.time) return;
    const hs=S.habits.filter(h=>h.groupId===g.id).map(h=>h.name).join(', ');
    const d=nextDateFor(g.days);
    add({dtstart:'DTSTART:'+icsDT(d,g.time),dtend:'DTEND:'+icsDT(d,toTime(toMin(g.time)+15)),
      title:g.name+' 루틴',desc:hs,cat:'루틴',alarm:g.notify!==''?+g.notify:0,
      rrule:'FREQ=WEEKLY;BYDAY='+g.days.map(x=>BYDAY[x]).join(',')});
  });
  S.habits.forEach(h=>{
    if(!h.time||!alive(h)) return;
    if(h.groupId&&!h.notify) return;
    const d=nextDateFor(habDays(h));
    add({dtstart:'DTSTART:'+icsDT(d,h.time),
      dtend:'DTEND:'+icsDT(d,toTime(toMin(h.time)+(h.min||15))),
      title:h.name,cat:catOf(h.catId).name,alarm:h.notify!==''?+h.notify:undefined,
      rrule:'FREQ=WEEKLY;BYDAY='+habDays(h).map(x=>BYDAY[x]).join(',')});
  });
  S.goals.forEach(g=>{
    if(g.due) add({dtstart:'DTSTART:'+icsDT(g.due,'09:00'),dtend:'DTEND:'+icsDT(g.due,'09:30'),
      title:'[D-DAY] '+g.title,desc:g.note||'',cat:'목표',alarm:0});
    (g.steps||[]).forEach(s=>{ if(s.due)
      add({dtstart:'DTSTART:'+icsDT(s.due,'09:00'),dtend:'DTEND:'+icsDT(s.due,'09:30'),
        title:'['+g.title+'] '+s.title,cat:'목표',alarm:0}); });
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}
function exportICS(){
  sendFile('haru-'+today()+'.ics',buildICS(),'text/calendar;charset=utf-8',
    '캘린더 파일을 만들었어요');
}

let syncTimer=null, lastSyncJSON='', syncBusy=false;
function syncPayload(){
  const o={};
  Object.keys(S).forEach(k=>{ if(k!=='push'&&k!=='sync') o[k]=S[k]; });
  return o;
}
function newRoom(){
  const c='abcdefghjkmnpqrstuvwxyz23456789';
  let r=''; for(let i=0;i<10;i++) r+=c[Math.floor(Math.random()*c.length)];
  return 'haru-'+r;

async function syncCall(body){
  const u=(S.push.url||'').trim().replace(/\/+$/,'');
  if(!u) throw new Error('서버 주소가 없어요');
  const r=await fetch(u+'/sync',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||('서버 '+r.status));

}
function adopt(data,rev){
  const keepPush=S.push, keepSync=S.sync;
  S=migrate(data);
  S.push=keepPush;
  S.sync={room:keepSync.room,on:true,rev:rev,at:nowHM()};
  lastSyncJSON=JSON.stringify(syncPayload());
}
async function syncDown(silent){
  if(!S.sync.room) { if(!silent) toast('동기화 코드를 먼저 정해 주세요'); return false; }
  try{
    const j=await syncCall({room:S.sync.room});
    if(!j.data){ if(!silent) toast('서버에 아직 기록이 없어요. 먼저 다른 기기에서 올려 주세요.'); return false; }
    adopt(j.data,j.rev||0);
    save(); render(); if(!silent) toast('서버 기록을 가져왔어요');
    return true;
  }catch(e){ if(!silent) toast('실패: '+e.message); return false; }
}
async function syncUp(silent){
  if(!S.sync.room||syncBusy) return false;
  syncBusy=true;
  try{
    const data=syncPayload();
    const j=await syncCall({room:S.sync.room,rev:S.sync.rev||0,data});
    if(j.stale&&j.data){
      adopt(j.data,j.rev||0);
      save(); render();
      toast('다른 기기 기록이 더 최신이라 그걸 가져왔어요');
    } else {
      S.sync.rev=j.rev||0; S.sync.at=nowHM(); S.sync.on=true;
      lastSyncJSON=JSON.stringify(data);
      save(); if(!silent){ render(); toast('서버에 올렸어요'); }
    }
    return true;
  }catch(e){ if(!silent) toast('실패: '+e.message); return false; }
  finally{ syncBusy=false; }
}
function syncAuto(){
  if(!S.sync.on||!S.sync.room) return;
  const now=JSON.stringify(syncPayload());
  if(now===lastSyncJSON) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>syncUp(true),3000);
}
async function syncStart(){
  if(!S.sync.on||!S.sync.room||syncBusy) return;
  try{
    const j=await syncCall({room:S.sync.room});
    if(j.data&&(j.rev||0)>(S.sync.rev||0)){
      adopt(j.data,j.rev||0); save(); render(); toast('다른 기기에서 바뀐 내용을 가져왔어요');
    } else {
      const now=JSON.stringify(syncPayload());
      if(now!==lastSyncJSON&&lastSyncJSON!=='') syncUp(true);
      else lastSyncJSON=now;
    }
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) syncStart(); });

/* ══════════ 폰 알림 (푸시) ══════════ */
const PUSH_OK=('serviceWorker' in navigator)&&('PushManager' in window)&&(typeof Notification!=='undefined');
let schedHash='', pushTimer=null;
const purl=()=>(S.push.url||'').trim().replace(/\/+$/,'');
function urlB64(str){
  const s2=(str+'='.repeat((4-str.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/');
  const b=atob(s2), u=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i);
  return u;
}
function pushSchedule(){
  const weekly=[], dated=[], t=today(), limit=addDays(t,120);
  S.groups.forEach(g=>{
    if(!g.notify||!g.time) return;
    const hs=S.habits.filter(h=>h.groupId===g.id);
    if(!hs.length) return;
    const at=toMin(g.time)-+g.notify;
    if(at<0) return;
    weekly.push({k:'g'+g.id,dow:g.days.slice(),at:toTime(at),
      title:g.name+' 시간이에요',body:hs.map(h=>h.name).join(', ').slice(0,90)});
  });
  S.habits.forEach(h=>{
    if(!h.notify||!alive(h)) return;
    const body=h.min?h.min+'분 예정':'';
    if(h.from||h.to){
      for(let i=0;i<120;i++){
        const d=addDays(t,i);
        if(d>limit) break;
        if(!onDay(h,d)) continue;
        const ht=effTime(h,d); if(!ht) continue;
        const at=toMin(ht)-+h.notify; if(at<0) continue;
        dated.push({k:'h'+h.id,date:d,at:toTime(at),title:h.name+' 시간이에요',body});
      }
    } else {
      const map={};
      habDays(h).forEach(dw=>{
        const ht=effTimeDow(h,dw); if(!ht) return;
        const at=toMin(ht)-+h.notify; if(at<0) return;
        const key=toTime(at);
        (map[key]=map[key]||[]).push(dw);
      });
      Object.keys(map).forEach(at=>weekly.push({k:'h'+h.id+at,dow:map[at],at,
        title:h.name+' 시간이에요',body}));
    }
  });
  S.events.forEach(e=>{
    if(!e.notify) return;
    const base=e.allDay?540:toMin(e.start);
    const body=(e.allDay?'하루 종일':e.start+' 시작')+(e.location?' · '+e.location:'');
    if(isRepeat(e)){
      const at=base-+e.notify;
      if(at<0) return;
      weekly.push({k:'e'+e.id,dow:e.repeatDays.slice(),at:toTime(at),title:e.title,body});
    } else if(e.date&&e.date<=limit){
      let m=base-+e.notify, date=e.date;
      while(m<0){ m+=1440; date=addDays(date,-1); }
      if(date>=t) dated.push({k:'e'+e.id,date,at:toTime(m),
        title:(date===e.date?'':'내일 ')+e.title,body});
    }
  });
  S.goals.forEach(g=>{
    if(g.due&&g.due>=t&&g.due<=limit)
      dated.push({k:'d'+g.id,date:g.due,at:'09:00',title:'오늘이 '+g.title+' 날이에요',body:'D-DAY'});
    (g.steps||[]).forEach(x=>{
      if(x.due&&!x.done&&x.due>=t&&x.due<=limit)
        dated.push({k:'s'+x.id,date:x.due,at:'09:00',title:x.title,body:g.title+' 단계 마감일'});
    });
  });
  return {weekly,dated};
}
async function pushSubscription(){
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub){
    const r=await fetch(purl()+'/key');
    if(!r.ok) throw new Error('서버에 닿지 못했어요 ('+r.status+')');
    const j=await r.json();
    if(!j.key) throw new Error('서버에 공개 열쇠가 없어요');
    sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64(j.key)});
  }

}

    ${(()=>{const y=yearLeft();
      return `<button class="yearbar" data-tab="stat">

    </div></div>`;

function ddayStrip(){
  const gs=S.goals.filter(g=>g.due).sort((a,b)=>a.due<b.due?-1:1);
  if(!gs.length) return '';
  return `<div class="ddays">${gs.map(g=>{
    const n=diffDays(today(),g.due), p=goalProg(g);
    return `<button class="dday" data-gotocal="${g.due}">
      <span class="n ${n<0?'past':''}">${n===0?'D-DAY':n>0?'D-'+n:'D+'+(-n)}</span>
      <b>${esc(g.title)}</b><small>${md(g.due)} · 진행 ${Math.round(p*100)}%</small>
      <span class="bar"><i style="width:${p*100}%"></i></span></button>`;
  }).join('')}</div>`;
}
function vToday(){
  const nm=nowMin();
  const nextA=view===today()?alarmsFor(view).find(x=>x.at>=nm):null;
  const hsAll=habitsOn(view).filter(h=>!isSkip(view,h.id));
  const hd=hsAll.filter(h=>isDone(view,h.id)).length;
  const td=todosOn(view), tdd=td.filter(x=>x.done).length;
  const evs=eventsOn(view);
  const out=sum(moneyOn(view).filter(m=>m.type==='out'),m=>m.amount);
  const tabs=[['routine','루틴',hsAll.length?`${hd}/${hsAll.length}`:''],
              ['todo','할 일',td.length?`${tdd}/${td.length}`:''],
              ['event','일정',evs.length?String(evs.length):''],
              ['money','지출',out?shortWon(out):''],
              ['note','한 줄',(log(view).note||'').trim()?'✓':'']];
  const am=activeMode(view);
  return header()+
    (am?`<button class="modebar" data-tab="routine">
      <span class="mb"><b>${esc(am.name)}</b> ${am.from?md(am.from)+'–'+md(am.to):(am.base?'기본 루틴도 함께':'이 모드 루틴만')}</span>
      <span class="ms">${(S.modeOverride&&S.modeOverride.date===view)?'직접 적용'
        :modeReserved(view)?'예약':'적용중'}</span></button>`:'')+
    ddayStrip()+
    (S.notify.on&&nextA?`<div class="card"><div class="alarmrow" style="border-top:none">
      <span class="t" style="color:var(--habit)">${toTime(nextA.at)}</span>
      <span class="n">다음 알림 · ${esc(nextA.label)}</span>
      <span class="s">${nextA.kind}</span></div></div>`:'')+
    `<div class="seg seg4">${tabs.map(([k,l,badge])=>
      `<button data-htab="${k}" class="${homeTab===k?'on':''}">${l}${badge?`<u>${badge}</u>`:''}</button>`).join('')}</div>`+
    (homeTab==='routine'?tabRoutine()
     :homeTab==='todo'?tabTodo()
     :homeTab==='event'?tabEvent()
     :homeTab==='note'?tabNote():tabMoney());
}

/* ── 루틴 탭 ── */
function tabRoutine(){
  const gs=groupsOn(view), so=soloOn(view);
  const listMode=(S.homeView||'card')==='list';
  const head=`<div class="sechead"><h2>${md(view)}의 루틴</h2>
    <button data-homeview="${listMode?'card':'list'}" style="color:var(--muted)">${listMode?'카드로':'목록으로'}</button>
    <button data-addsheet="1" style="margin-left:12px">＋ 추가</button></div>`;
  if(!gs.length&&!so.length)
    return head+`<div class="card"><div class="empty">이 요일에 할 게 없어요.
      <b>＋ 추가</b>로 습관이나 루틴을 만들어 보세요.</div></div>`;

  if(listMode){
    const byT=(a,b)=>(a.time?toMin(a.time):99999)-(b.time?toMin(b.time):99999);
    const buckets=[];
    gs.forEach(g=>{
      const rs=habitsOfGroupOn(g.id,view).map(h=>({h,time:effTime(h,view)||g.time||''}));
      rs.sort(byT);
      buckets.push({name:g.name,time:g.time||(rs[0]?rs[0].time:''),rows:rs});
    });
    if(so.length){
      const rs=so.map(h=>({h,time:effTime(h,view)||''}));
      rs.sort(byT);
      buckets.push({name:'따로 하는 습관',time:rs[0]?rs[0].time:'',rows:rs});
    }
    buckets.sort(byT);
    return head+`<div class="card"><div class="lst">${buckets.map(bk=>
      `<div class="lband">${esc(bk.name)}${bk.time?`<u>${bk.time}</u>`:''}</div>`+
      bk.rows.map(({h,time})=>{
        const c=catOf(h.catId), dn=isDone(view,h.id), v=doneVal(view,h.id);
        const st=streak(h), sk=isSkip(view,h.id);
        const lvs=levelsOf(h), cur=(rec(view,h.id)||{}).lv||'';
        const curLv=lvs.find(x=>x[0]===cur);
        const tag=lvs.length&&!dn?'lvpick':'hab';
        return `<div class="lrow ${dn?'done':''} ${sk?'skip':''}">
          <span class="lw">${time?`<b>${time}</b>`:''}</span>
          <button class="ln" data-${tag}="${h.id}" style="border-left-color:${c.color}">
            <span class="nmx">${h.icon?esc(h.icon)+' ':''}${curLv?`<b class="lvb ${cur}">${curLv[1]}</b> `:''}${esc(curLv?curLv[2]:h.name)}</span>
            ${h.track&&v?`<em class="mn">${esc(v)}${esc(h.unit||'')}</em>`:''}
            ${effMin(h,view)?`<em class="mn">${effMin(h,view)}분</em>`:''}
            ${h.streakOn!==false&&st>0?`<em class="mn">🔥${st}</em>`:''}
            ${sk?'<em class="lrest">쉼</em>':''}
            ${(h.times>1&&!sk)?`<em class="mn">${doneN(view,h.id)}/${h.times}</em>`:''}</button>
          <button class="lc" data-${sk?'skip':tag}="${h.id}"
            style="${dn?`background:${c.color};border-color:${c.color}`:(sk?'opacity:.35':'')}">${dn?'✓':(sk?'–':'')}</button>
        </div>`;
      }).join('')
    ).join('')}</div></div>`;
  }

  return head+gs.map(g=>{
    const hs=habitsOfGroupOn(g.id,view);
    const act=hs.filter(h=>!isSkip(view,h.id));
    const done=act.filter(h=>isDone(view,h.id)).length, full=act.length>0&&done===act.length;
    const col=!!(S.collapsed||{})[g.id];
    return `<div class="grp ${full?'full':''}">
      <div class="gh">${ring(act.length?done/act.length:0)}
        <button class="t" data-fold="${g.id}"><b>${esc(g.name)} <i class="fx">${col?'▾':'▴'}</i></b>
          <small>${g.time?g.time+' · ':''}${g.min?g.min+'분 · ':''}${done}/${act.length} 완료${hs.length>act.length?` · 쉼 ${hs.length-act.length}`:''}${g.notify?' · 🔔':''}${full?' · 오늘 끝!':''}</small></button>
        <button class="allbtn" data-allgrp="${g.id}">${full?'되돌리기':'모두 체크'}</button></div>
      ${col?'':hs.map(habitRow).join('')+
        `<button class="addbtn" style="color:var(--habit)" data-addgrp="${g.id}">＋ 이 루틴에 습관 넣기</button>`}</div>`;
  }).join('')+
  (so.length?(()=>{
    const act=so.filter(h=>!isSkip(view,h.id));
    const dn=act.filter(h=>isDone(view,h.id)).length;
    const full=act.length>0&&dn===act.length;
    const col=!!(S.collapsed||{}).__solo;
    return `<div class="grp ${full?'full':''}">
      <div class="gh">${ring(act.length?dn/act.length:0)}
        <button class="t" data-fold="__solo"><b>습관 <i class="fx">${col?'▾':'▴'}</i></b>
          <small>${dn}/${act.length} 완료${so.length>act.length?` · 쉼 ${so.length-act.length}`:''}${full?' · 오늘 끝!':''}</small></button>
        <button class="allbtn" data-allsolo="1">${full?'되돌리기':'모두 체크'}</button></div>
      ${col?'':so.map(habitRow).join('')+
        '<button class="addbtn" style="color:var(--habit)" data-newsolo="1">＋ 습관 하나 더</button>'}</div>`;})():'');
}

/* ── 할 일 탭 ── */

    `${routineMode==='cat'?'':(()=>{const so=S.habits.filter(h=>noGroupAny(h)&&(catFilter==='all'||h.catId===catFilter)).sort(byOrd);
      return `<div class="card"><header><h2>따로 하는 습관</h2>

    <div class="card"><header><h2>루틴 모드</h2>

            ${on?'':`<button class="mact" data-usemode="${m.id}">적용</button>`}

      ${(S.modeOverride&&S.modeOverride.date===today())

    `;
}
function byDaySummary(h){
  const out=[];
  for(let i=0;i<7;i++){
    const b=bd(h,i); if(!b) continue;
    const g=(typeof b.g==='string')?(b.g?(grpOf(b.g)||{}).name||'?':'따로'):null;
    out.push(DAYS[i]+(g?' '+g:'')+(b.t?' '+b.t:''));
  }
  return out.length?out.join(' / '):'요일별 다름';
}
function mgmtRow(h,i,arr){
  const c=catOf(h.catId), st=streak(h), g=grpOf(h.groupId);
  const wk=Array.from({length:7},(_,x)=>addDays(monStart(today()),x));
  const grid=wk.map(d=>{
    const sch=habDays(h).includes(dow(d));
    return `<i class="${sch?'on':'no'}">${DAYS[dow(d)]}</i>`;
  }).join('');
  const many=Array.isArray(arr)&&arr.length>1;
  return `<div class="mrow" style="border-left-color:${c.color}">
    <button class="minfo" data-edithab="${h.id}">
      <span class="info"><b>${h.icon?esc(h.icon)+' ':''}${esc(h.name)}</b>
        <small>${esc(c.name)}${g?' · '+esc(g.name):' · 따로'}${h.time?' · '+h.time:''}${h.min?' · '+h.min+'분':''}${(h.from||h.to)?` · ${h.from?md(h.from):''}~${h.to?md(h.to):''}`:''}${hasByDay(h)?' · '+byDaySummary(h):''}${st>1?` · 🔥${st}`:''}</small></span>

      :'<span class="chev">›</span>'}

}

function vCal(){
  const [y,m]=calMonth.split('-').map(Number);
  const n=daysIn(calMonth), first=`${y}-${pad(m)}-01`;
  const lead=(dow(first)+6)%7;
  const cells=[];
  for(let i=0;i<lead;i++) cells.push('<div class="dc dim"></div>');
  for(let i=1;i<=n;i++){
    const d=`${y}-${pad(m)}-${pad(i)}`;
    const colors=[...new Set(eventsOn(d).map(e=>ecatOf(e.catId).color))].slice(0,2);
    const hasGoal=S.goals.some(g=>g.due===d||(g.steps||[]).some(s=>s.due===d));
    const hasTd=todosOn(d).length, r=rate(d);
    const hasNote=!!((S.logs[d]||{}).note||'').trim();
    cells.push(`<button class="dc ${d===view?'sel':''} ${d===today()?'tod':''}" data-selday="${d}">
      ${i}<span class="dots">
        ${colors.map(c=>`<i style="background:${c}"></i>`).join('')}
        ${hasGoal?'<i style="background:var(--goal)"></i>':''}
        ${hasTd?'<i style="background:var(--task)"></i>':''}
        ${hasNote?'<i style="background:var(--muted)"></i>':''}</span>
      <span class="rt" style="${r?`background:linear-gradient(90deg,var(--habit) ${r*100}%,var(--h0) ${r*100}%)`:''}"></span></button>`);
  }
  const prevM=m===1?`${y-1}-12`:`${y}-${pad(m-1)}`, nextM=m===12?`${y+1}-01`:`${y}-${pad(m+1)}`;
  const evs=eventsOn(view), dueG=S.goals.filter(g=>g.due===view);
  const dueS=[]; S.goals.forEach(g=>(g.steps||[]).forEach(s=>{if(s.due===view)dueS.push({g,s})}));
  const upcoming=S.events.filter(e=>!isRepeat(e)&&e.date&&evSpan(e)>1&&(e.endDate||e.date)>=today())
    .sort((a,b)=>a.date<b.date?-1:1);

  return `<div class="top"><div class="datenav"><div><h1>달력</h1>
      <p class="sub">점 색은 일정 분류, 회색 점은 한 줄 기록. 칸 아래 선은 습관 달성률이에요.</p></div>
      <button class="pill" data-newev="1">＋ 일정</button></div></div>
    <div class="card">
      <div class="calnav"><button data-cal="${prevM}">‹</button><b>${y}년 ${m}월</b>
        <button class="r" data-cal="${nextM}">›</button></div>
      <div class="cal"><div class="hd">${['월','화','수','목','금','토','일'].map(d=>`<span>${d}</span>`).join('')}</div>
        <div class="grid">${cells.join('')}</div></div>
      <div class="catbar" style="margin:0;padding:0 16px 14px">${S.ecats.map(c=>
        `<span class="catchip" style="box-shadow:none;background:var(--paper)">
          <u style="color:${c.color}">●</u>${esc(c.name)}</span>`).join('')}</div></div>
    <div class="card"><header><h2>${md(view)} ${DAYS[dow(view)]}요일</h2>
      <button class="add" data-newev="1">＋ 일정</button></header>
      ${dueG.map(g=>`<div class="ev gl"><span class="tm">D-DAY</span>
        <span class="bd"><b>${esc(g.title)}</b><small>목표한 날</small></span></div>`).join('')}
      ${dueS.map(({g,s})=>`<div class="ev gl"><span class="tm">단계</span>
        <span class="bd"><b>${esc(s.title)}</b><small>${esc(g.title)}</small></span></div>`).join('')}
      ${evs.map(e=>evRow(e,view)).join('')}
      ${(!evs.length&&!dueG.length&&!dueS.length)?'<div class="empty">이 날은 비어 있어요.</div>':''}
      ${(()=>{const nt=((S.logs[view]||{}).note||'').trim();
        return nt?`<div class="ev" style="border-left-color:var(--muted)">
          <span class="tm" style="color:var(--muted)">한 줄</span>
          <span class="bd"><b style="font-weight:500">${esc(nt)}</b></span></div>`:'';})()}
      <button class="addbtn" data-goday="${view}">이 날을 '오늘' 화면에서 보기 ›</button>
      <button class="addbtn" style="color:var(--muted)" data-gonote="${view}">한 줄 쓰기·고치기 ›</button></div>
    ${upcoming.length?`<div class="card"><header><h2>기간 일정</h2>
      <span class="count">${upcoming.length}개</span></header>
      ${upcoming.map(e=>{
        const c=ecatOf(e.catId), sp=evSpan(e), dd=diffDays(today(),e.date);
        return `<button class="mrow" data-ev="${e.id}" style="border-left-color:${c.color}">
          <span class="info"><b>${esc(e.title)}</b>
            <small>${md(e.date)}–${md(e.endDate)} · ${sp-1}박 ${sp}일${e.location?' · '+esc(e.location):''}</small></span>
          <span style="font-size:12px;font-weight:700;color:${c.color};flex:none">${dd>0?'D-'+dd:dd===0?'D-DAY':'진행 중'}</span>
          <span class="chev">›</span></button>`;
      }).join('')}</div>`:''}

    ${(()=>{
      const ns=Object.keys(S.logs).filter(d=>d.slice(0,7)===calMonth&&((S.logs[d].note||'').trim()))
        .sort().reverse();
      return `<div class="card"><header><h2>이 달의 한 줄</h2>
        <span class="count">${ns.length}개</span></header>
        ${ns.length?ns.map(d=>`<button class="pastnote" style="display:block;width:100%;text-align:left" data-gonote="${d}">
          <em>${md(d)} ${DAYS[dow(d)]}</em><p>${esc(S.logs[d].note)}</p></button>`).join('')
          :'<div class="empty">이 달엔 아직 기록이 없어요. 오늘 화면 「한 줄」 탭에서 적을 수 있어요.</div>'}
      </div>`;})()}
    <div class="card"><header><h2>캘린더로 내보내기</h2></header>
      <div class="empty" style="padding-bottom:8px">일정·기간·장소·루틴 시각·목표를 캘린더 파일로 넘기면,
        이 앱을 닫아도 폰이 알림을 울려 줍니다.
        ${IS_IOS?'버튼을 누르면 공유 창이 떠요. <b>캘린더</b>를 고르고 <b>모든 캘린더에 추가</b>를 누르면 끝입니다.'
          :'내려받은 .ics 파일을 열어 캘린더에 추가하세요.'}</div>
      <button class="addbtn" style="color:var(--goal)" data-export="1">캘린더에 넘기기</button></div>
    <div class="sechead"><h2>목표</h2><span>${S.goals.length}개</span>
      <button data-newgoal="1" style="color:var(--goal)">＋ 목표</button></div>`+
    (S.goals.length?S.goals.slice().sort((a,b)=>(a.due||'9')<(b.due||'9')?-1:1).map(g=>{
      const dn=g.due?diffDays(today(),g.due):null, p=goalProg(g);
      const steps=g.steps||[];
      const done=steps.filter(x=>x.done).length;
      const el=g.from&&g.due&&diffDays(g.from,g.due)>0
        ? Math.min(1,Math.max(0,diffDays(g.from,today())/diffDays(g.from,g.due))):null;
      let tag='';
      if(el!==null&&steps.length){
        const gap=p-el;
        tag=gap>=0.05?'<b class="tg ok">여유 있어요</b>'
          :gap<=-0.05?'<b class="tg late">조금 서둘러요</b>':'<b class="tg mid">속도 좋아요</b>';
      }
      return `<div class="goal"><div class="gth">
          <span class="big"><i>${dn===null?'—':dn===0?'D-DAY':dn>0?'D-'+dn:'D+'+(-dn)}</i>
            <s>${g.due?md(g.due):'날짜 없음'}</s></span>
          <button class="gt" data-editgoal="${g.id}"><b>${esc(g.title)}</b>
            ${g.note?`<small>${esc(g.note)}</small>`:''}
            <span class="pbar"><i style="width:${p*100}%"></i>${el!==null?`<s style="left:${el*100}%"></s>`:''}</span>
            <span class="pl">${steps.length?`<span>단계 ${done}/${steps.length}</span>`:'<span>단계를 넣어 보세요</span>'}
              ${dn!==null&&dn>0?`<span>${dn}일 남음</span>`:''}${tag}</span></button></div>
        ${(g.steps||[]).map(s=>{
          const late=s.due&&!s.done&&s.due<today();
          return `<button class="step ${s.done?'done':''} ${late?'late':''}" data-stepedit="${g.id}:${s.id}">
            <span class="box" data-step="${g.id}:${s.id}">✓</span><span>${esc(s.title)}</span>
            <small>${s.due?(late?'지남 ':'')+md(s.due):''}</small></button>`;
        }).join('')}
        <button class="addbtn" style="color:var(--goal)" data-newstep="${g.id}">＋ 단계 추가</button></div>`;
    }).join(''):`<div class="card"><div class="empty">시험·이사처럼 날짜가 있는 일을 넣고 단계로 쪼개 보세요.</div>
      <button class="addbtn" style="color:var(--goal)" data-newgoal="1">＋ 목표 만들기</button></div>`);
}

function txRow(m){

    <span class="m"><b>${esc(m.memo||c.name)}</b><small>${esc(c.name)}</small></span>
    <span class="v ${m.type}">${m.type==='in'?'+':'−'}${won(m.amount)}</span></button>`;
}
function vMoney(){
  const [y,m]=moneyMonth.split('-').map(Number);
  const rows=moneyIn(moneyMonth);
  const out=sum(rows.filter(r=>r.type==='out'),r=>r.amount);
  const inc=sum(rows.filter(r=>r.type==='in'),r=>r.amount);
  const b=S.budget||0, left=b-out;
  const isCur=moneyMonth===monthOf(today());
  const restDays=isCur?daysIn(moneyMonth)-+today().slice(8)+1:0;
  const byCat={};
  rows.filter(r=>r.type==='out').forEach(r=>{byCat[r.catId]=(byCat[r.catId]||0)+r.amount});
  const cats=Object.entries(byCat).sort((a,b2)=>b2[1]-a[1]);
  const dates=[...new Set(rows.map(r=>r.date))].sort().reverse();
  const prevM=m===1?`${y-1}-12`:`${y}-${pad(m-1)}`, nextM=m===12?`${y+1}-01`:`${y}-${pad(m+1)}`;

  return `<div class="top"><div class="datenav"><div><h1>가계부</h1>
      <p class="sub">쓴 돈과 남은 예산을 하루 단위로 봅니다.</p></div>
      <button class="pill g" data-newtx="1">＋ 기록</button></div></div>
    <div class="card">
      <div class="calnav"><button data-mmonth="${prevM}">‹</button><b>${y}년 ${m}월</b>
        <button class="r" data-mmonth="${nextM}">›</button></div>
      <div style="padding:4px 16px 18px">
        <div style="color:var(--muted);font-size:12.5px">이번 달 지출</div>
        <div style="font-size:30px;font-weight:780;letter-spacing:-.03em">${won(out)}</div>
        <div style="display:flex;gap:18px;margin-top:12px">
          <div style="font-size:12.5px;color:var(--muted)">수입<b style="display:block;font-size:15px;color:var(--habit)">${won(inc)}</b></div>
          <div style="font-size:12.5px;color:var(--muted)">순액<b style="display:block;font-size:15px;color:${inc-out>=0?'var(--habit)':'var(--task)'}">${won(inc-out)}</b></div>
        </div>
        <div class="budget">
          <div class="l"><span>월 예산</span><b>${b?won(b):'미설정'}</b></div>
          ${b?`<div class="bar"><i class="${out>b?'over':''}" style="width:${Math.min(100,out/b*100)}%"></i></div>
            <div class="per">${left>=0?`남은 예산 ${won(left)}`:`예산 초과 ${won(-left)}`}
              ${(isCur&&left>0&&restDays>0)?` · 남은 ${restDays}일 동안 하루 ${won(Math.floor(left/restDays))}`:''}</div>`
            :'<div class="per">예산을 정하면 하루에 쓸 수 있는 금액을 알려드려요.</div>'}
          <button class="pill g" style="margin:11px 0 0" data-budget="1">예산 ${b?'수정':'설정'}</button>
        </div></div></div>
    <div class="card"><header><h2>분류별 지출</h2><span class="count">${cats.length}개</span></header>
      ${cats.length?`<div style="padding:10px 0 14px">${cats.map(([id,v])=>{
        const c=mcatOf(id);
        return `<div class="prow"><b><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c.color};margin-right:6px"></span>${esc(c.name)}</b>
          <span class="bar"><i style="width:${out?v/out*100:0}%;background:${c.color}"></i></span>
          <small>${won(v)}</small></div>`;
      }).join('')}</div>`:'<div class="empty">아직 지출 기록이 없어요.</div>'}</div>
    <div class="card"><header><h2>기록</h2><span class="count">${rows.length}건</span>
      <button class="add" style="color:var(--goal)" data-newtx="1">＋ 추가</button></header>
      <div style="margin-top:10px">
      ${dates.length?dates.map(d=>{
        const rs=rows.filter(r=>r.date===d);
        return `<div class="daygrp"><span>${md(d)} ${DAYS[dow(d)]}</span>
          <span>${won(sum(rs.filter(r=>r.type==='out'),r=>r.amount))}</span></div>`+rs.map(txRow).join('');
      }).join(''):'<div class="empty">＋ 기록으로 첫 지출을 남겨 보세요.</div>'}</div></div>
`;
}

function statCats(){
  const arr=S.habits.filter(h=>alive(h));
  const has=id=>arr.some(h=>h.catId===id);
  return `<div class="catbar">
    <button class="catchip ${statCat==='all'?'on':''}" data-statcat="all">전체</button>
    ${S.cats.filter(c=>has(c.id)).map(c=>`<button class="catchip ${statCat===c.id?'on':''}" data-statcat="${c.id}">
      <u style="color:${statCat===c.id?'var(--onAccent)':c.color}">●</u>${esc(c.name)}</button>`).join('')}
    ${arr.some(h=>!S.cats.some(c=>c.id===h.catId))?
      `<button class="catchip ${statCat==='none'?'on':''}" data-statcat="none">분류 없음</button>`:''}
  </div>`;
}
function statHabits(){
  const list=S.habits.filter(h=>alive(h)).filter(h=>
    statCat==='all'?true:statCat==='none'?!S.cats.some(c=>c.id===h.catId):h.catId===statCat);
  return list.sort((a,b)=>{
    const ia=S.cats.findIndex(c=>c.id===a.catId), ib=S.cats.findIndex(c=>c.id===b.catId);
    return ((ia<0?99:ia)-(ib<0?99:ib))||byOrd(a,b);
  });
}
function rateOf(d,hs){
  const a=hs.filter(h=>onDay(h,d)&&!isSkip(d,h.id));
  return a.length?a.filter(h=>isDone(d,h.id)).length/a.length:null;
}
function avgOf(days,hs){
  const v=days.map(d=>rateOf(d,hs)).filter(x=>x!==null);
  return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;
}
function statYMlabel(){
  const [y,m]=statYM.split('-').map(Number);
  return `${y}년 ${m}월`;
}
function statRange(){
  const t=today();
  if(statMode==='week') return Array.from({length:7},(_,i)=>addDays(monStart(t),i)).filter(d=>d<=t);
  const ym=statYM;
  return Array.from({length:daysIn(ym)},(_,i)=>`${ym}-${pad(i+1)}`).filter(d=>d<=t);
}

/* ── 주간 ── */
function statWeek(){
  const t=today();
  const mon=weekStart||monStart(t);
  const week=Array.from({length:7},(_,i)=>addDays(mon,i));
  const hs=statHabits();
  const avg=avgOf(week.filter(d=>d<=t),hs);
  const prevW=addDays(mon,-7), nextW=addDays(mon,7);
  const canNext=nextW<=monStart(t);
  const label=statCat==='all'?'전체':statCat==='none'?'분류 없음':catOf(statCat).name;
  return statCats()+`<div class="card">
      <div class="calnav"><button data-week="${prevW}">‹</button>
        <b>${md(mon)} – ${md(addDays(mon,6))}</b>
        ${canNext?`<button class="r" data-week="${nextW}">›</button>`
          :'<button class="r" disabled style="opacity:.3">›</button>'}</div>
      <div style="padding:2px 16px 8px;font-size:13px;color:var(--muted)">
        ${esc(label)} 달성률 <b style="color:var(--ink);font-size:15px;font-weight:750">${avg===null?'—':Math.round(avg*100)+'%'}</b></div>
      <div class="wk">
        <div class="wkh"><span></span>${week.map(d=>
          `<i class="${d===t?'td':''}">${DAYS[dow(d)]}</i>`).join('')}</div>
        ${hs.length?hs.map(h=>
          `<div class="wkr"><span>${h.icon?esc(h.icon)+' ':''}${esc(h.name)}</span>${week.map(d=>{
            const sch=onDay(h,d);
            const dn=isDone(d,h.id);
            const cls=dn?'on':(!sch?'off':(isSkip(d,h.id)?'sk':(d>t?'sch':'miss')));
            return `<i class="${cls}"></i>`;
          }).join('')}</div>`).join(''):'<div class="empty">이 분류에 습관이 없어요.</div>'}
      </div>
      <div class="wkl">지킴 <i class="on"></i>
        놓침 <i class="miss"></i> 쉼 <i class="sk"></i> 없는 요일 <i class="off"></i></div>
    </div>`;
}

/* ── 월간: 습관마다 달력 카드 ── */
function statMonthView(){
  const [y,m]=statYM.split('-').map(Number);
  const days=Array.from({length:daysIn(statYM)},(_,i)=>`${statYM}-${pad(i+1)}`);
  const past=days.filter(d=>d<=today());
  const hsF=statHabits();
  const avg=avgOf(past,hsF);
  const prevM=m===1?`${y-1}-12`:`${y}-${pad(m-1)}`;
  const nextM=m===12?`${y+1}-01`:`${y}-${pad(m+1)}`;
  const canNext=nextM<=monthOf(today());
  const totalChecks=past.reduce((a,d)=>a+hsF.filter(h=>isDone(d,h.id)).length,0);
  const perfect=past.filter(d=>rateOf(d,hsF)===1).length;
  const spent=sum(moneyIn(statYM).filter(r=>r.type==='out'),r=>r.amount);

  return statCats()+`<div class="card">
      <div class="calnav"><button data-smonth="${prevM}">‹</button><b>${statYMlabel()}</b>
        ${canNext?`<button class="r" data-smonth="${nextM}">›</button>`
          :'<button class="r" disabled style="opacity:.3">›</button>'}</div>
      <div style="padding:6px 16px 18px">
        <div style="display:flex;align-items:baseline;justify-content:space-between">
          <span style="font-size:13.5px;color:var(--muted)">목표 달성률</span>
          <b style="font-size:26px;font-weight:780;letter-spacing:-.03em">${avg===null?'—':Math.round(avg*100)+'%'}</b></div>
        <div class="bar" style="height:8px;margin-top:9px"><i style="width:${avg===null?0:avg*100}%;
          background:linear-gradient(90deg,var(--h3),var(--habit))"></i></div>
        <div style="display:flex;gap:16px;margin-top:13px">
          <div style="font-size:12px;color:var(--muted)">체크 수<b style="display:block;font-size:15px;color:var(--ink)">${totalChecks}</b></div>
          <div style="font-size:12px;color:var(--muted)">전부 채운 날<b style="display:block;font-size:15px;color:var(--ink)">${perfect}일</b></div>
          <div style="font-size:12px;color:var(--muted)">지출<b style="display:block;font-size:15px;color:var(--ink)">${shortWon(spent)}원</b></div>
        </div>
      </div></div>
    ${hsF.length?`<div class="hgrid">${hsF.map(h=>habitMonthCard(h,statYM)).join('')}</div>`
      :'<div class="card"><div class="empty">이 분류에 습관이 없어요.</div></div>'}`;
}
function habitMonthCard(h,ym){
  const c=catOf(h.catId);
  const n=daysIn(ym);
  const days=Array.from({length:n},(_,i)=>`${ym}-${pad(i+1)}`);
  const lead=(dow(days[0])+6)%7;
  let cells='';
  for(let i=0;i<lead;i++) cells+='<i class="e"></i>';
  days.forEach(d=>{
    const sch=onDay(h,d);
    const dn=isDone(d,h.id);
    const future=d>today();
    const cls=dn?'on':(!sch?'off':(isSkip(d,h.id)?'sk':(future?'fu':'miss')));
    const st=dn?`background:${c.color};color:#fff`:'';
    cells+=`<i class="${cls}" style="${st}">${+d.slice(8)}</i>`;
  });
  const sch=days.filter(d=>onDay(h,d)&&d<=today()&&!isSkip(d,h.id));
  const done=sch.filter(d=>isDone(d,h.id)).length;
  const pct=sch.length?Math.round(done/sch.length*100):0;
  let extra='';
  if(h.track==='num'){
    const vs=days.filter(d=>d<=today()).map(d=>parseFloat(doneVal(d,h.id))).filter(x=>!isNaN(x));
    if(vs.length){
      const av=vs.reduce((a,b)=>a+b,0)/vs.length;
      extra=`<div class="hx">평균 ${(Math.round(av*10)/10)}${esc(h.unit||'')}</div>`;
    }
  } else if(h.track==='time'){
    const at=avgTime(h,days.filter(d=>d<=today()));
    if(at) extra=`<div class="hx">평균 ${at}</div>`;
  }
  const st=h.streakOn!==false?streak(h):0;
  return `<div class="hcard">
    <div class="ht"><span class="dot" style="background:${c.color}"></span>
      <b>${h.icon?esc(h.icon)+' ':''}${esc(h.name)}</b>${st>1?`<u>🔥${st}</u>`:''}</div>
    <div class="hcal">${cells}</div>
    <div class="hf"><span>${sch.length?pct+'%':'—'}</span><em>✓ ${done}</em></div>
    ${extra}
  </div>`;
}

/* ── 초록불 ── */
function statGreen(){
  const t=today();
  const ym=statYM, [y,m]=ym.split('-').map(Number);
  const days=Array.from({length:daysIn(ym)},(_,i)=>`${ym}-${pad(i+1)}`);
  const past=days.filter(d=>d<=t);
  const acted=past.filter(d=>Object.keys(log(d).habits||{}).length>0).length;
  const green=past.filter(d=>rate(d)===1).length;
  const noted=past.filter(d=>(log(d).note||'').trim()).length;
  const avg=avgRate(past);
  const lead=(dow(days[0])+6)%7;
  const prevM=m===1?`${y-1}-12`:`${y}-${pad(m-1)}`;
  const nextM=m===12?`${y+1}-01`:`${y}-${pad(m+1)}`;
  const canNext=nextM<=monthOf(t);
  let cells='';
  for(let i=0;i<lead;i++) cells+='<span class="gd e"></span>';
  days.forEach(d=>{
    const r=rate(d);
    const lv=d>t?-1:(r===null?0:r>=1?4:r>=.67?3:r>=.34?2:r>0?1:0);
    cells+=`<span class="gd l${lv<0?'f':lv} ${d===t?'td':''}">${+d.slice(8)}</span>`;
  });
  return `<div class="kpis">
      <div class="kpi"><i>${acted}일</i><small>루틴 체크한 날</small></div>
      <div class="kpi"><i style="color:var(--habit)">${green}회</i><small>전부 채운 날</small></div>
      <div class="kpi"><i>${noted}일</i><small>한 줄 기록</small></div>
    </div>
    <div class="card">
      <div class="calnav"><button data-smonth="${prevM}">‹</button><b>${y}년 ${m}월</b>
        ${canNext?`<button class="r" data-smonth="${nextM}">›</button>`
          :'<button class="r" disabled style="opacity:.3">›</button>'}</div>
      <div class="gcal">
        <div class="gch">${['월','화','수','목','금','토','일'].map(x=>`<span>${x}</span>`).join('')}</div>
        <div class="gcg">${cells}</div>
      </div>
      <div style="padding:4px 16px 18px">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)">
          <span>이번 달 달성률</span><b style="color:var(--ink);font-size:14px">${avg===null?'—':Math.round(avg*100)+'%'}</b></div>
        <div class="bar" style="height:7px;margin-top:8px"><i style="width:${avg===null?0:avg*100}%;
          background:linear-gradient(90deg,var(--h2),var(--habit))"></i></div>
      </div>
    </div>
    <div class="card"><header><h2>연속 달성</h2><span class="count">지금 이어지는 날수</span></header>
      <div style="padding:6px 0 14px">${S.habits.length?S.habits.map(h=>{
        const c=catOf(h.catId), n=streak(h);
        return `<div class="prow"><b><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c.color};margin-right:6px"></span>${esc(h.name)}</b>
          <span class="bar"><i style="width:${Math.min(100,n/30*100)}%;background:${c.color}"></i></span>
          <small>${n?'🔥 '+n+'일':'—'}</small></div>`;
      }).join(''):'<div class="empty">습관을 추가하면 여기에 쌓여요.</div>'}</div></div>`;
}


function habitStatRows(){
  const range=statRange();
  if(!S.habits.length) return '<div class="empty">습관을 추가하면 여기에 쌓여요.</div>';
  return S.habits.map(h=>{
    const sch=range.filter(d=>habDays(h).includes(dow(d)));
    const dn=sch.filter(d=>isDone(d,h.id)).length;
    const p=sch.length?Math.round(dn/sch.length*100):0;
    const at=avgTime(h,range);
    return `<div class="prow"><b>${esc(h.name)}</b>
      <span class="bar"><i style="width:${p}%"></i></span>
      <small>${sch.length?p+'%':'—'}${at?' · '+at:''}</small></div>`;
  }).join('');
}

/* ══════════ 이벤트 ══════════ */
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-tab],[data-nav],[data-stat],[data-cal],[data-mmonth],[data-rmode],[data-cfilter],[data-selday],[data-goday],[data-gotocal],[data-hab],[data-time],[data-settime],[data-cleartime],[data-savetime],[data-allgrp],[data-todo],[data-deltodo],[data-addtodo],[data-move],[data-step],[data-stepedit],[data-newstep],[data-savestep],[data-delstep],[data-newgrp],[data-editgrp],[data-savegrp],[data-delgrp],[data-newhab],[data-edithab],[data-savehab],[data-delhab],[data-newcat],[data-editcat],[data-savehabcat],[data-delhabcat],[data-newecat],[data-editecat],[data-saveevcat],[data-delevcat],[data-newmcat],[data-editmcat],[data-savemcat],[data-delmcat],[data-pickcat],[data-pickecat],[data-picktype],[data-color],[data-newev],[data-ev],[data-saveev],[data-delev],[data-newgoal],[data-editgoal],[data-savegoal],[data-delgoal],[data-newtx],[data-tx],[data-savetx],[data-deltx],[data-mtype],[data-pickm],[data-budget],[data-savebudget],[data-togglenotify],[data-export],[data-closebanner],[data-statcat],[data-gonote],[data-hardrefresh],[data-copyhab],[data-skip],[data-mvgrp],[data-usemode],[data-toggcatedit],[data-editcatinline],[data-catcancel],[data-delcatinline],[data-newmode],[data-editmode],[data-savemode],[data-delmode],[data-showcatnew],[data-newcolor],[data-addcat],[data-mvhab],[data-addgrp],[data-movehab],[data-htab],[data-fold],[data-homeview],[data-addsheet],[data-newsolo],[data-addtogrp],[data-pickhab],[data-allsolo],[data-lvpick],[data-checklv],[data-week],[data-smonth],[data-nextline],[data-newline],[data-saveline],[data-delline],[data-linemode],[data-syncsheet],[data-syncup],[data-syncdown],[data-syncfirst],[data-syncjoin],[data-syncoff],[data-genroom],[data-pushsheet],[data-pushconnect],[data-pushtest],[data-pushcheck],[data-pushoff],[data-backupout],[data-backupin],[data-install],[data-day],[data-quick],[data-close],[data-reset]');
  if(!el) return;
  const d=el.dataset;

  if(d.closebanner){$('#banner').classList.remove('on');return}
  if(d.tab){tab=d.tab;render();window.scrollTo(0,0);return}
  if(d.nav!==undefined){view=d.nav==='0'?today():addDays(view,+d.nav);calMonth=monthOf(view);render();return}
  if(d.stat){statMode=d.stat;render();return}
  if(d.cal){calMonth=d.cal;render();return}
  if(d.mmonth){moneyMonth=d.mmonth;render();return}
  if(d.rmode){routineMode=d.rmode;render();return}
  if(d.cfilter){catFilter=d.cfilter;render();return}
  if(d.selday){view=d.selday;render();return}
  if(d.goday){view=d.goday;tab='today';render();window.scrollTo(0,0);return}
  if(d.statcat){statCat=d.statcat;render();return}
  if(d.gonote){view=d.gonote;tab='today';homeTab='note';render();window.scrollTo(0,0);return}
  if(d.gotocal){view=d.gotocal;calMonth=monthOf(view);tab='cal';render();window.scrollTo(0,0);return}
  if(d.export){exportICS();return}
  if(d.togglenotify){
    if(S.notify.on){S.notify.on=false;save();render();toast('알림을 껐어요')} else askNotify();
    return;
  }
  if(d.hab){
    const l=log(view), t=habTimes(d.hab), r=l.habits[d.hab];
    if(!r) l.habits[d.hab]={at:view===today()?nowHM():'',lv:'',n:1};
    else {
      const n=(r.n||1)+1;
      if(n>t) delete l.habits[d.hab];
      else { r.n=n; if(view===today()) r.at=nowHM(); }
    }
    save();render();return;
  }
  if(d.time){timeSheet(d.time);return}
  if(d.settime){$('#f-time').value=d.settime;return}
  if(d.cleartime){const r=rec(view,d.cleartime);if(r)r.at='';save();closeSheet();render();return}
  if(d.savetime){
    const l=log(view);
    if(!l.habits[d.savetime]) l.habits[d.savetime]={at:'',lv:'',n:habTimes(d.savetime)};
    const r=l.habits[d.savetime];
    r.at=$('#f-time').value||'';
    const vi=$('#f-val'); if(vi) r.v=vi.value.trim();
    save();closeSheet();render();toast('기록했어요');return;
  }
  if(d.allgrp){
    const hs=habitsOfGroupOn(d.allgrp,view), l=log(view);
    const full=hs.every(h=>l.habits[h.id]);
    hs.forEach(h=>{ if(full) delete l.habits[h.id];
      else l.habits[h.id]=Object.assign({at:view===today()?nowHM():'',lv:''},
        l.habits[h.id]||{},{n:habTimes(h.id)}); });
    save();render(); if(!full) toast('묶음 완료!');
    return;
  }
  if(d.todo){const t=S.todos.find(x=>x.id===d.todo);t.done=!t.done;save();render();return}
  if(d.deltodo){S.todos=S.todos.filter(x=>x.id!==d.deltodo);save();render();return}
  if(d.addtodo){const i=$('#todoInput'),v=i.value.trim();if(!v){i.focus();return}
    S.todos.push({id:uid(),title:v,date:view,done:false});save();focusTodo=true;render();return}
  if(d.move){S.todos.forEach(t=>{if(!t.done&&t.date<today())t.date=today()});save();render();toast('오늘로 옮겼어요');return}
  if(d.step){const[gi,si]=d.step.split(':');
    const s=S.goals.find(x=>x.id===gi).steps.find(x=>x.id===si);s.done=!s.done;save();render();return}
  if(d.stepedit){const[gi,si]=d.stepedit.split(':');stepSheet(gi,si);return}
  if(d.newstep){stepSheet(d.newstep,null);return}
  if(d.newgrp){grpSheet(null);return}
  if(d.editgrp){grpSheet(d.editgrp);return}
  if(d.newhab){habSheet(d.newhab,null);return}
  if(d.edithab){habSheet(null,d.edithab);return}
  if(d.newcat){genCatSheet('hab',null);return}
  if(d.editcat){genCatSheet('hab',d.editcat);return}
  if(d.newecat){genCatSheet('ev',null);return}
  if(d.editecat){genCatSheet('ev',d.editecat);return}
  if(d.newmcat){mcatSheet(null);return}
  if(d.editmcat){mcatSheet(d.editmcat);return}
  if(d.newev){evSheet(null);return}
  if(d.ev){evSheet(d.ev);return}
  if(d.newgoal){goalSheet(null);return}
  if(d.editgoal){goalSheet(d.editgoal);return}
  if(d.newtx){txSheet(null);return}
  if(d.tx){txSheet(d.tx);return}
  if(d.budget){budgetSheet();return}
  if(d.close){closeSheet();return}

  if(d.day){const n=+d.day;
    sheetDays=sheetDays.includes(n)?sheetDays.filter(x=>x!==n):sheetDays.concat(n);syncDays();return}
  if(d.quick){sheetDays=d.quick==='all'?[0,1,2,3,4,5,6]:d.quick==='week'?[1,2,3,4,5]:d.quick==='end'?[0,6]:[];
    syncDays();return}
  if(d.pickcat){sheetPick.cat=d.pickcat;
    document.querySelectorAll('[data-pickcat]').forEach(b=>b.classList.toggle('on',b.dataset.pickcat===d.pickcat));return}
  if(d.pickecat){sheetPick.ecat=d.pickecat;
    document.querySelectorAll('[data-pickecat]').forEach(b=>b.classList.toggle('on',b.dataset.pickecat===d.pickecat));return}
  if(d.picktype){sheetPick.mtype=d.picktype;
    document.querySelectorAll('[data-picktype]').forEach(b=>b.classList.toggle('on',b.dataset.picktype===d.picktype));return}

  if(d.pushconnect){
    const v=$('#f-purl').value.trim();
    if(!v) return showErr('서버 주소를 넣어 주세요.');
    if(!/^https:\/\//.test(v)) return showErr('https:// 로 시작하는 주소여야 해요.');
    S.push.url=v.replace(/\/+$/,''); save();
    pushConnect(false).then(ok=>{ if(ok) closeSheet(); });
    return;
  }
  if(d.pushtest){pushTest();return}
  if(d.pushcheck){pushCheck();return}
  if(d.pushoff){pushOff();return}
  if(d.backupout){backupOut();return}
  if(d.backupin){$('#importFile').click();return}
  if(d.install){
    if(installEvt){installEvt.prompt();installEvt=null;render()}
    else toast('브라우저 메뉴에서 홈 화면에 추가를 눌러 주세요');
    return;
  }
  if(d.reset){
    S={version:19,cats:S.cats,ecats:S.ecats,mcats:S.mcats,groups:[],habits:[],events:[],todos:[],
       goals:[],money:[],budget:0,notify:{on:S.notify.on,fired:{}},push:S.push,sync:S.sync,
       lines:S.lines,lineMode:S.lineMode,modes:S.modes,activeModeId:S.activeModeId,modeOverride:null,
       collapsed:{},homeView:S.homeView,
       logs:{},seeded:false};
    save();tab='today';view=today();render();toast('처음 상태로 돌렸어요');return;
  }
});

document.addEventListener('change',e=>{
  if(e.target.id==='f-own'){$('#ownDays').style.display=e.target.value==='1'?'block':'none'}
  if(e.target.id==='f-grp'){
    const solo=!e.target.value;
    const ow=$('#ownWrap'), od=$('#ownDays');
    if(ow) ow.style.display=solo?'none':'block';
    if(od) od.style.display=solo?'block':($('#f-own').value==='1'?'block':'none');
  }
  if(e.target.id==='f-kind'){$('#timeRow').style.display=e.target.value==='all'?'none':'flex'}
  if(e.target.id==='f-vary'){const b=$('#varyBox');if(b)b.style.display=e.target.value==='1'?'block':'none'}
  if(e.target.id==='f-date'){
    const ed=$('#f-enddate');
    if(ed&&(!ed.value||ed.value<e.target.value)) ed.value=e.target.value;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='todoInput'){
    e.preventDefault();
    const v=e.target.value.trim(); if(!v) return;
    S.todos.push({id:uid(),title:v,date:view,done:false});save();focusTodo=true;render();
  }
  if(e.key==='Escape') closeSheet();
});
document.addEventListener('input',e=>{
  if(e.target.id==='note'){log(view).note=e.target.value;save()}
  if(e.target.id==='f-color'){
    sheetPick.color=e.target.value;
    const hl=$('#hexLab'); if(hl) hl.textContent=e.target.value.toUpperCase();
    document.querySelectorAll('[data-color]').forEach(b=>
      b.classList.toggle('on',b.dataset.color.toLowerCase()===e.target.value.toLowerCase()));
  }
});
$('#scrim').addEventListener('click',closeSheet);
document.getElementById('importFile').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];
  if(f) backupIn(f);
  e.target.value='';
});
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); installEvt=e; if(S) render();
});
window.addEventListener('appinstalled',()=>{installEvt=null;if(S)render()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
load();
</script>
</body>
</html>
